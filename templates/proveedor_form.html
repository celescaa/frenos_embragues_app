{% extends "base.html" %}
{% block title %}{{ 'Editar proveedor' if proveedor else 'Nuevo proveedor' }}{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'Editar proveedor' if proveedor else 'Nuevo proveedor' }}</h4>
<div class="card p-4" style="max-width: 640px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Nombre / Razón social *</label>
      <input type="text" name="nombre" class="form-control" required value="{{ proveedor.nombre if proveedor else '' }}">
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono if proveedor else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ proveedor.email if proveedor else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Dirección</label>
      <input type="text" name="direccion" class="form-control" value="{{ proveedor.direccion if proveedor else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">CUIT</label>
      <input type="text" name="cuit" class="form-control" value="{{ proveedor.cuit if proveedor else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('proveedores_lista') }}" class="btn btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
