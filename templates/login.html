<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | {{ negocio.nombre }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root { --si-black: #111111; --si-gold: #f2b705; --si-gold-dark: #caa100; }
  body {
    background: var(--si-black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card { max-width: 380px; width: 100%; border-radius: 16px; border-top: 4px solid var(--si-gold); }
  .btn-primary { background-color: var(--si-gold); border-color: var(--si-gold); color: #171717; font-weight: 600; }
  .btn-primary:hover { background-color: var(--si-gold-dark); border-color: var(--si-gold-dark); color: #171717; }
  .form-control:focus { border-color: var(--si-gold); box-shadow: 0 0 0 0.25rem rgba(242, 183, 5, 0.25); }
</style>
</head>
<body>
<div class="card login-card p-4 shadow">
  <div class="text-center mb-3">
    <img src="{{ url_for('static', filename='img/logo_icon_soft.png') }}" alt="{{ negocio.nombre }}" height="110">
    <h5 class="mt-2 mb-0">{{ negocio.nombre }}</h5>
    <div class="text-muted small">{{ negocio.subtitulo }}</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else category }} py-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
  </form>
</div>
</body>
</html>
