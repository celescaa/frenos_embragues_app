[pytest]
# La salida de los tests tiene que quedar limpia: una advertencia que aparece
# siempre deja de leerse, y el día que aparezca una de verdad va a pasar
# desapercibida entre el ruido.
#
# Esta es del paquete `supabase` (su módulo interno de timers usa una función
# de asyncio que Python 3.16 va a sacar). No es código de este proyecto y no
# hay nada que arreglar de este lado: se silencia SOLO ese mensaje y SOLO
# desde ese módulo, para no tapar de paso una advertencia propia. Cuando el
# paquete lo corrija, esta línea se puede borrar.
filterwarnings =
    error::DeprecationWarning:core.*
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:supabase_auth.*
